# Cloud-профиль: OpenRouter. Использовать ТОЛЬКО с pseudo_* / публичными данными
# (правила: CLAUDE.md, docs/07). Запуск: --config configs/config.cloud.yaml

profile: cloud

llm:
  api_base: "https://openrouter.ai/api/v1"
  api_key: "${OPENROUTER_API_KEY}"        # брать из переменной окружения, не хардкодить
  model: "qwen/qwen-2.5-7b-instruct"      # ВНИМАНИЕ: у OpenRouter свои ID моделей
  reflection_model: "qwen/qwen-2.5-72b-instruct"  # 32B может отсутствовать; 72B — ок для рефлексии
  reflection_api_base: "https://openrouter.ai/api/v1"
  max_ctx_chars: 24000

  # Специфика OpenRouter: под одним ID — несколько нижележащих провайдеров.
  # Для стабильных logprobs роутинг надо ограничить. Передавать в extra_body
  # каждого запроса (клиент должен читать этот блок из конфига):
  openrouter_extra_body:
    provider:
      require_parameters: true      # роутить только к провайдерам, поддерживающим
                                    # ВСЕ параметры запроса (logprobs/top_logprobs)
      allow_fallbacks: false        # без тихой подмены провайдера между запросами
      order: ["Phala"]              # зафиксирован после smoke-теста (task-3):
                                    # единственный провайдер, вернувший top_logprobs

data:
  train: "data/processed/pseudo_dev_train.jsonl"
  val:   "data/processed/pseudo_dev_val.jsonl"
  test:  "data/processed/pseudo_dev_test.jsonl"

m3:
  mode: "zero_shot"
  gepa_auto: "light"          # в облаке — только light (отладка механики)
  gepa_train_size: 50
  use_marker_feedback: true
  seed: 0
  out_prompt: "artifacts/cloud/m3_optimized_prompt.txt"
  out_pred_dir: "predictions/cloud/m3"   # отдельно от боевых predictions!
  judge_cache: "artifacts/cloud/m3_judge_cache"

m6:
  n_samples: 5                # меньше, чем в бою: дешевле, для отладки хватает
                              # (абляция N=10 не улучшила entropy-сигнал — docs/08 §5)
  temperature: 0.8
  top_p: 0.95
  max_new_tokens: 512
  nli_model: "MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7"  # локально, CPU/GPU
  embed_model: "intfloat/multilingual-e5-large"                            # локально
  samples_cache: "artifacts/cloud/m6_samples"
  features_cache: "artifacts/cloud/m6_features"
  out_pred_dir: "predictions/cloud/m6"
  entail_threshold: 0.5

pseudo:
  gen_model: "qwen/qwen-2.5-7b-instruct" # генератор ответов псевдо-корпуса (решение: 7B)
  n: 300
  seed: 42
  source: "sberquad" # kuznetsoffandrey/sberquad, split train
  cache: "artifacts/pseudo_gen" # поэлементный кэш генераций
  out_dir: "data/processed" # pseudo_dev_{train,val,test}.jsonl
