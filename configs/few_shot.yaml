# 7 примеров для ступени few_shot Метода 3 (отобраны из pseudo_dev_train).
# Итоги B1/B2: заякорить ОБЕ оси. Обязательны:
#   - off_topic с FAITHFULNESS: PASS, RELEVANCE: FAIL (B1 не взял это промптом);
#   - >=2 incomplete_answer с явным «опущена/неполна» (B2, слепая зона judge);
#   - строгий rel=FAIL с формулой «не отвечает на вопрос» (противовес размытию rel из B1).
# ctx укорочен до абзаца-источника + одного дистрактора. «analysis» — вручную, 1–2 предложения.
examples:
  # 1. clean — оба PASS
  - q: "К чему может привести указание значений физических величин без уточнения условий?"
    ctx: |
      [Чанк 1] Стандартные условия для температуры и давления — это значения температуры и давления, с которыми соотносятся значения других физических величин. Принятые в разных дисциплинах точные значения давления и температуры в стандартных условиях могут различаться, поэтому указание значений физических величин (объёма моля газа, электродного потенциала и т. п.) без уточнения условий, в которых они приводятся, может приводить к ошибкам.
      [Чанк 2] Через среднюю часть сперматозоида проходит цитоскелет жгутика из микротрубочек; митохондрион синтезирует АТФ и обеспечивает движение жгутика.
    a: "Указание значений физических величин без уточнения условий, в которых они приводятся, может приводить к ошибкам."
    analysis: "Ответ дословно опирается на чанк 1 и прямо отвечает на вопрос о последствии — фактов извне нет, тема совпадает."
    faith: "PASS"
    rel: "PASS"

  # 2. clean — оба PASS, другой домен
  - q: "В каком виде производится программное обеспечение?"
    ctx: |
      [Чанк 1] Особенность программного обеспечения в том, что оно производится в одной форме — в виде исходного текста, а распространяется и используется часто в другой — в виде исполнимых программ, машинных кодов, по которым невозможно однозначно восстановить исходный текст.
      [Чанк 2] Имплантат в форме бабочки измеряет кровяное давление в реальном времени; размер — чуть меньше 50 копеек.
    a: "Программное обеспечение производится в одной форме — в виде исходного текста, а распространяется и используется в виде исполнимых программ (машинных кодов)."
    analysis: "Утверждение полностью подтверждено чанком 1 и отвечает именно на заданный вопрос о форме производства — обе оси в порядке."
    faith: "PASS"
    rel: "PASS"

  # 3. hallucination — FAIL faith, PASS rel (подменён факт-дата)
  - q: "Как называется альбом канадской группы Arcade Fire, завоевавший премию Грэмми в номинации «Альбом года»?"
    ctx: |
      [Чанк 1] Канадская группа Arcade Fire (чей альбом The Suburbs 2010 года возглавил многие национальные чарты и выиграл Грэмми в номинации «альбом года»).
      [Чанк 2] В Вильнюсе открыто несколько десятков старинных и новых храмов различных конфессий, действует несколько монастырей.
    a: "Альбом Arcade Fire, завоевавший Грэмми в номинации «альбом года», — это The Suburbs 2008 года."
    analysis: "Название альбома верно, но год искажён: в ответе 2008, в чанке 1 — 2010. Подменён факт — FAITHFULNESS: FAIL. На вопрос про альбом ответ по существу отвечает — RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"

  # 4. incomplete_answer — FAIL faith, PASS rel (опущена деталь)
  - q: "В течение скольких лет после появления первых многоклеточных организмов произошло значительное повышение их биоразнообразия?"
    ctx: |
      [Чанк 1] После появления первых многоклеточных организмов в течение последующих примерно 10 миллионов лет произошло значительное повышение их биоразнообразия, получившее название Кембрийского взрыва.
      [Чанк 2] Средством достижения этих целей является создание единых прозрачных стандартов для бизнес- и конференц-отелей на глобальном уровне.
    a: "После появления первых многоклеточных организмов в течение примерно 10 миллионов лет произошло значительное повышение их биоразнообразия."
    analysis: "Срок назван верно, но опущена важная деталь из чанка 1 — что это повышение носит название «Кембрийский взрыв». Ответ неполон относительно контекста — FAITHFULNESS: FAIL, тема верна — RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"

  # 5. incomplete_answer — FAIL faith, PASS rel (вторая формулировка неполноты)
  - q: "На какой основе составляются расписания для каждой отдельной машины и иногда для каждой отдельной остановки?"
    ctx: |
      [Чанк 1] На основе общего графика составляются расписания для каждой отдельной машины и иногда для каждой отдельной остановки (столбовое расписание). В графиках для отдельных машин обычно указывают несколько ключевых пунктов маршрута.
      [Чанк 2] Перемычки — временное явление в жизни спиральных галактик; постепенно перемычка разрушается.
    a: "Расписания для каждой отдельной машины и остановки составляются на основе общего графика."
    analysis: "Основа названа верно, но ответ неполный: опущено, что расписание отдельной остановки называется «столбовым» — деталь из чанка 1. FAITHFULNESS: FAIL, RELEVANCE: PASS."
    faith: "FAIL"
    rel: "PASS"

  # 6. off_topic_answer — ЯКОРЬ B1: PASS faith, FAIL rel (оси независимы)
  - q: "С каким прогнозом агентство RusRating сохраняет кредитный рейтинг Собинбанка на уровне BB-?"
    ctx: |
      [Чанк 1] Moody’s Investors Service повысило прогноз долгосрочных рейтингов депозитов Собинбанка на уровне В3 со стабильного на позитивный, оценив поддержку Газэнергопромбанка. Агентство RusRating сохраняет кредитный рейтинг Собинбанка на уровне BB- с прогнозом «стабильный».
      [Чанк 2] Предшественники гитары имели продолговатый пустотелый корпус и длинную шейку со струнами.
    a: "Агентство Moody’s оценило потенциал Собинбанка в контексте поддержки Газэнергопромбанка и стремления материнской компании интегрировать банк в новую банковскую группу."
    analysis: "Ответ верен по фрагментам (сведения про Moody’s есть в чанке 1), но не отвечает на вопрос — спрашивали про прогноз RusRating («стабильный»), а не про оценку Moody’s. Оси независимы: FAITHFULNESS: PASS, RELEVANCE: FAIL."
    faith: "PASS"
    rel: "FAIL"

  # 7. off_topic_answer — ЯКОРЬ rel: строгий FAIL с формулой «не отвечает на вопрос»
  - q: "На сколько устройство поможет уменьшить частоту госпитализаций пациентов?"
    ctx: |
      [Чанк 1] Имплантат в форме бабочки измеряет кровяное давление в реальном времени. По оценкам авторов, устройство позволит уменьшить частоту госпитализации пациентов на 40 %. Имплантат замеряет давление и передаёт сигнал на датчик, данные отправляются на веб-сайт лечащего врача.
      [Чанк 2] Существует предание о поэтическом поединке Гомера с Гесиодом, описанное не позднее III в. до н. э.
    a: "Устройство постоянно замеряет кровяное давление и передаёт данные на датчик, который отправляет информацию лечащему врачу через веб-сайт."
    analysis: "Всё сказанное подтверждено чанком 1, поэтому FAITHFULNESS: PASS. Но ответ не отвечает на вопрос: спрашивали «на сколько процентов» (40 %), а ответ описывает принцип работы. RELEVANCE: FAIL."
    faith: "PASS"
    rel: "FAIL"
