[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reliability-judge"
version = "0.1.0"
description = "LLM-as-judge and consistency methods for assessing reliability of RAG answers (faithfulness + relevance)"
requires-python = ">=3.11"
# Ядро — общее для обоих пакетов (rag_reliability — бенчмарк-харнесс,
# rag_reliability_m3m6 — пайплайн ветки m3-m6); тяжёлые стеки — в extras.
dependencies = [
    "scikit-learn>=1.4",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
    "typer>=0.12,<1",
    "openai>=1.40",        # клиент к vLLM/OpenRouter (OpenAI-совместимый API), m3-m6
    "pandas>=2.0",         # results_index, загрузка корпуса (m3-m6)
    "razdel>=0.5",         # русская сентенизация (Метод 6, m3-m6)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "mlflow>=2.12",        # нужен тестам tracking ветки m3-m6 (файловый стор)
]
mlx = [
    "mlx-lm>=0.20",
    # transformers v5 breaks mlx-lm tokenizer registration
    # (TOKENIZER_MAPPING.register gets a str config_class)
    "transformers<5",
]
lettucedetect = [
    "lettucedetect",
    "torch",
    "transformers<5",
    "joblib>=1.3",
]
encoder = [
    "accelerate>=0.26.0",
    "torch>=2.3",
    "transformers>=4.44,<5",
    "datasets>=2.18",
    "pandas>=2.0",
]
m6 = [
    "torch>=2.3",
    "transformers>=4.44,<5",
    "sentence-transformers>=3.0",
]
cloud = [
    "openai>=1.0",
]
gepa = [
    "dspy>=2.6.14",
]
demo = [
    "gradio>=4.0,<6",
    "huggingface-hub>=0.34,<1",
]
viz = [
    "matplotlib>=3.8",
    "plotly>=5.20",
    "streamlit>=1.35",
]
tracking = [
    "mlflow>=2.12",
]
data = [
    "datasets>=2.20",      # SberQuAD для псевдо-корпуса
    "dvc>=3.50",
]

[project.scripts]
rag-judge = "rag_reliability.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# тесты работают и без editable-установки (запуск из корня репо)
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# from_organizators и data/baseline.ipynb — код организаторов;
# reference_src — референс платформы
extend-exclude = ["from_organizators", "reference_src", "data/baseline.ipynb"]

[tool.ruff.lint]
# `l` как имя строки (`for l in fh`) — идиома кодовой базы m3-m6, не переименовываем.
ignore = ["E741"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
