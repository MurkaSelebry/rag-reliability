[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-reliability-judge"
version = "0.1.0"
description = "Fine-tuned LLM-as-judge for assessing reliability of RAG answers (faithfulness + relevance)"
requires-python = ">=3.11"
dependencies = [
    "scikit-learn>=1.3",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.8",
]
mlx = [
    "mlx-lm>=0.20",
    # transformers v5 breaks mlx-lm tokenizer registration
    # (TOKENIZER_MAPPING.register gets a str config_class)
    "transformers<5",
]
lettucedetect = [
    "lettucedetect",
    "torch",
    "transformers<5",
    "joblib>=1.3",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
